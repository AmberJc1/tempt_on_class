<!DOCTYPE html>
<html>
<head>
    <title>表单核心示例</title>
    <meta charset="UTF-8">
    <style>
        /* 简单样式，让表单更易读 */
        form {
            width: 400px;
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
        }
        .form-item {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 80px;
        }
       
    </style>
</head>
<body>
    <!-- form容器：提交到后端接口（这里用#模拟），POST方式提交 -->
    <form action="#" method="POST">
        <!-- 1. 文本输入框（用户名） -->
        <div class="form-item">
            <label for="username">用户名：</label>
            <input type="text" id="username" name="username" placeholder="请输入用户名" required>
        </div>

        <!-- 2. 密码输入框 -->
        <div class="form-item">
            <label for="pwd">密码：</label>
            <input type="password" id="pwd" name="password" placeholder="请输入密码" required>
        </div>

        <!-- 3. 单选框（性别） -->
        <div class="form-item">
            <label>性别：</label>
            <input type="radio" name="gender" value="male" id="male">
            <label for="male">男</label>
            <input type="radio" name="gender" value="female" id="female" checked>
            <label for="female">女</label>
        </div>

        <!-- 4. 复选框（爱好） -->
        <div class="form-item">
            <label>爱好：</label>
            <input type="checkbox" name="hobby" value="code" id="code">
            <label for="code">编程</label>
            <input type="checkbox" name="hobby" value="read" id="read">
            <label for="read">阅读</label>
        </div>

        <!-- 5. 下拉选择框（城市） -->
        <div class="form-item">
            <label for="city">城市：</label>
            <select name="city" id="city">
                <option value="">请选择</option>
                <option value="beijing">北京</option>
                <option value="shanghai" selected>上海</option>
            </select>
        </div>

        <!-- 6. 多行文本框（备注） -->
        <div class="form-item">
            <label for="desc">备注：</label>
            <textarea name="desc" id="desc" rows="3" cols="20" placeholder="请输入备注"></textarea>
        </div>

        <!-- 7. 按钮 -->
        <div class="form-item">
            <button type="reset">重置</button>
            <button type="submit">提交</button>
            <button type="button" onclick="alert('第二次修改普通按钮吗')">普通按钮</button>
        </div>
    </form>
</body>
</html>
